plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id "org.jetbrains.kotlin.plugin.compose" version "2.0.0"
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.21'
}

android {
    namespace "com.example.android.memoization"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.android.memoization"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    // The exported schemas are what MigrationTest runs the migrations against.
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildFeatures {
        compose true
    }

}

ext {
    room_version = "2.6.0"
    compose_version = "1.5.4"
    okHttp_version = "4.8.0"
    core_version = "1.17.0"
    hilt_android = "2.57.2"
    nav_version = "2.9.5"
    core_ktx = "1.9.0"
    constraint = "2.1.4"
    j_unit = "4.13.2"
    ext_j_unit = "1.1.5"
    espresso = "3.5.1"
    preference_version = "1.2.1"
    compose_bom = "2024.02.00"
    constraint_compose = "1.1.1"
}

dependencies {
    implementation "androidx.core:core-ktx:$core_version"

    //internal
    implementation(project(":translation"))

    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.core:core-ktx:$core_version"

    //ui
    implementation "androidx.constraintlayout:constraintlayout:$constraint"
    implementation "androidx.compose.material3:material3:1.4.0"

    //navigation
    implementation "androidx.navigation:navigation-compose:$nav_version"


    //compose
    def composeBom = platform("androidx.compose:compose-bom:$compose_bom")
    implementation(composeBom)
    implementation "androidx.compose.material:material"
    implementation("androidx.activity:activity-compose")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.material3:material3:1.2.0-beta01")

    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"
    implementation "androidx.constraintlayout:constraintlayout-compose:$constraint_compose"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'

    //livedata
    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.1"

//    implementation 'io.coil-kt:coil-compose:1.3.0'
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

    //test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Testing Navigation
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    //coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4")

    //ROOM
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"


    //network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:okhttp:$okHttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okHttp_version"

    // DI
    implementation "com.google.dagger:hilt-android:$hilt_android"
    ksp "com.google.dagger:hilt-compiler:2.57.1"   // Hilt compiler
    implementation "androidx.hilt:hilt-navigation-compose:1.0.0"
//    kapt 'androidx.hilt:hilt-compiler:1.0.0'


    //datastore
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.datastore:datastore:1.0.0"



    // JSON serialization library, works with the Kotlin serialization plugin.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.0"
}